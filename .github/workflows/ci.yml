name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: api tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the newest supported interpreter; pyproject still declares
        # requires-python >= 3.10 for users, we just don't matrix-test it in CI.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev + api extras)
        run: |
          python -m pip install --upgrade pip
          # api extra (fastapi/uvicorn) is required too: tests/test_api_*.py
          # import tradingagents.api, which imports fastapi at module load time.
          pip install -e ".[dev,api]"
      - name: Run api test suite
        # Scoped to this fork's actual focus (the API layer). Same -k filter
        # as `invoke test-api` / `make test-api`.
        run: pytest -q -k test_api

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (api scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the API layer
        # Scoped to this fork's actual focus (the API layer), not the full
        # upstream trading-agent codebase.
        run: ruff check tradingagents/api

  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so leaked secrets in past commits are caught too.
          fetch-depth: 0
      - name: Download gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan for secrets
        # A real leak fails the job outright; this one is a hard gate, not a
        # report-only check.
        run: ./gitleaks detect --source . --redact -v

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev,bedrock]" pip-audit
      - name: Audit installed dependencies
        # Report-only: known CVEs in the (largely third-party) dependency tree
        # aren't something we can always fix on our own schedule, so this
        # surfaces findings in the job summary without blocking merges.
        # continue-on-error must live on the step, not the job: a job-level
        # continue-on-error still leaves the job's own check red, it only
        # keeps the overall workflow conclusion from being dragged down.
        continue-on-error: true
        run: |
          set -o pipefail
          pip-audit --desc --format markdown | tee -a "$GITHUB_STEP_SUMMARY"

  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Scan the API layer for common security issues
        # Report-only, same rationale as pip-audit above. Scoped to this
        # fork's actual focus (the API layer), not the full upstream
        # trading-agent codebase.
        continue-on-error: true
        run: |
          set -o pipefail
          bandit -r tradingagents/api -ll -f txt | tee -a "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: docker build (Dockerfile.api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        # Only the API image: this fork's CI is scoped to the API layer, the
        # core CLI image (Dockerfile) isn't part of that.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: tradingagents-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
